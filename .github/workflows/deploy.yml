name: Deploy to Unikraft Cloud

on:
  push:
    branches: [ "main" ] # 或者你的默认分支名称

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用官方提供的 Unikraft CLI Action
      - name: Install Unikraft CLI (KraftKit)
        uses: unikraft/setup-action@v1

      # 登录并部署到 Unikraft Cloud
      - name: Run on Unikraft Cloud
        env: 
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }} # 需要在仓库 Secrets 中配置你的 Unikraft 凭证
        run: |
          kraft run \
            --metro fra \
            --publish 443:8080/http+tls \
            --scale-to-zero policy=on,cooldown-time=1000 \
            --image ghcr.io/huangshelvey/uni:latest
